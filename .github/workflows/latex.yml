name: Build canonical PDF snapshots

on:
  push:
    branches: [repo-layout-paper-identities]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repo-layout-paper-identities
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern poppler-utils python3 python3-sympy make
      - name: Build snapshots
        run: |
          make pdf
          make test
          make verify
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build committed PDF snapshots [skip ci]"
            git push origin HEAD:repo-layout-paper-identities
          fi
